name: APM Android dev Build
on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches:
      - 'dev'
      - 'dev-newarch'
  workflow_dispatch:
jobs:
  checkLastCommit:
    uses: ./.github/workflows/reuse-check-last-commit.yml      
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: checkLastCommit
    if: ${{ needs.checkLastCommit.outputs.is_new_commit }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android Build Setup
        uses: ./.github/composite-actions/android-runner-setup

      - name: React Native Build Setup
        id: rnsetup
        uses: ./.github/composite-actions/RN-setup
        with:
          env: ${{ secrets.ENV_FILE }}
          sentry: ${{ secrets.SENTRY_PROPERTIES }}

      - name: python fixHTTP & version bump
        run: |
          python ./scripts/dev_cleartext.py
          python ./scripts/release_bump.py --dev

      # ✅ 新增核心步骤：临时禁用签名校验（关键！避免gradle签名配置冲突）
      - name: Disable APK Sign (关闭签名，无签名打包核心)
        run: echo "android.buildTypes.release.signingConfig=null" >> ./android/gradle.properties
        shell: /usr/bin/bash

      # ✅ 核心修改：移除所有签名参数，纯净无签名打包
      - name: Build Android (无签名Release包)
        uses: ./.github/composite-actions/build-apk
        with:
          buildtype: assembleRelease  # 明确指定无签名Release打包命令

      # ✅ 原样保留：打包产物自动上传到GitHub Release，路径不变
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GIT_BRANCH }}-build-${{ steps.rnsetup.outputs.date }}
          files: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          prerelease: true
          target_commitish: ${{ env.GIT_BRANCH }}
